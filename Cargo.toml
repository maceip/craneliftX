[package]
name = "cranelift-isr"
version = "0.1.0"
edition = "2021"
default-run = "cranelift-isr"
description = "In-process x86-64 trace lifting to interpreted RISC-V 64"
license = "MIT OR Apache-2.0"

[dependencies]
# iced-x86 requires either std or no_std even for decoder-only builds.
iced-x86 = { version = "1.21", default-features = false, features = ["std", "decoder", "intel", "instr_info"] }
cranelift-codegen = { version = "0.115", default-features = false, features = ["riscv64", "x86", "arm64"] }
libc = "0.2"
cranelift-frontend = "0.115"
target-lexicon = "0.13"
object = { version = "0.36", default-features = false, features = ["read", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.8"
ctrlc = "3.4"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
