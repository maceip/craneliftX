name: Build CI image
description: Build the optimized local toolchain container and load it as ceremony-ci:local.

runs:
  using: composite
  steps:
    - name: Set up Buildx
      uses: docker/setup-buildx-action@v4
    - name: Read pinned LLVM major
      shell: bash
      run: echo "PINNED_LLVM=$(cat .llvm-version 2>/dev/null || echo 20)" >> "$GITHUB_ENV"
    - name: Build toolchain container
      uses: docker/build-push-action@v7
      with:
        context: docker
        file: docker/ci.Dockerfile
        tags: ceremony-ci:local
        load: true
        build-args: |
          LLVM_MAJOR=${{ env.PINNED_LLVM }}
        # Image attestations are separate from the binary attestations this
        # workflow signs later, and they slow the cached image build.
        provenance: false
        sbom: false
        cache-from: type=gha,scope=ceremony-ci
        cache-to: type=gha,scope=ceremony-ci,mode=max
    - name: Show image size
      shell: bash
      run: docker image inspect ceremony-ci:local --format 'ceremony-ci:local {{.Size}} bytes'
