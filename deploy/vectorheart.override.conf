# Install as /etc/systemd/system/craneliftx.service.d/deployment.conf.
# vectorheart already uses 8765 for mail authentication; keep ISR on 8879.
[Service]
User=craneliftx
Group=craneliftx
WorkingDirectory=/srv/craneliftx/current
Environment=ISR_WORKER=/srv/craneliftx/current/target/release/isr-demo
ExecStart=
ExecStart=/srv/craneliftx/current/.venv/bin/python webapp/server.py --host 127.0.0.1 --port 8879
Nice=5
CPUWeight=20
MemoryMax=512M
TasksMax=128
ProtectSystem=strict
ProtectHome=true
